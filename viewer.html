<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>History Sync — Просмотр истории</title>
<style>
  :root {
    --bg: #0a0a0a; --card: #161616; --card2: #1e1e1e; --border: #2a2a2a;
    --text: #e8e8e8; --dim: #888; --dim2: #555; --accent: #4a9eff; --accent-dim: #1a3a5c;
    --green: #34c759; --red: #ff5b5b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    font-size: 15px; line-height: 1.4;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  input, button { font-family: inherit; font-size: 15px; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  /* ---------- LOGIN ---------- */
  #login {
    max-width: 420px; margin: 0 auto; padding: 40px 20px;
    min-height: 100%; display: flex; flex-direction: column; justify-content: center;
  }
  #login h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.3px; }
  #login .sub { color: var(--dim); font-size: 13px; margin-bottom: 28px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 5px; padding-left: 2px; }
  .field input {
    width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 12px 14px; outline: none; transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .field-row { display: flex; gap: 10px; }
  .btn-primary {
    width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 13px; font-weight: 600; margin-top: 8px; transition: opacity 0.15s;
  }
  .btn-primary:active { opacity: 0.7; }
  .btn-primary:disabled { opacity: 0.4; }
  .remember { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--dim); font-size: 13px; }
  .remember input { width: 16px; height: 16px; accent-color: var(--accent); }
  #login-error { color: var(--red); font-size: 13px; margin-top: 14px; min-height: 18px; text-align: center; }

  /* ---------- APP ---------- */
  #app { display: none; height: 100%; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  header .title { font-weight: 600; font-size: 16px; }
  header .spacer { flex: 1; }
  header button {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font-size: 13px;
  }
  header button:active { background: var(--card2); }

  .layout { flex: 1; display: flex; min-height: 0; }
  /* sidebar */
  .sidebar {
    width: 240px; flex-shrink: 0; border-right: 1px solid var(--border);
    overflow-y: auto; padding: 10px;
  }
  .dev {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    margin-bottom: 4px; cursor: pointer; border: 1px solid transparent;
  }
  .dev:active { background: var(--card); }
  .dev.active { background: var(--card); border-color: var(--border); }
  .dev .icon { font-size: 18px; width: 24px; text-align: center; }
  .dev .meta { flex: 1; min-width: 0; }
  .dev .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev .count { font-size: 11px; color: var(--dim2); }
  .dev .spin { font-size: 12px; color: var(--accent); }

  /* main */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .searchbar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
  .searchbar input {
    flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 10px 14px; outline: none;
  }
  .searchbar input:focus { border-color: var(--accent); }
  .searchbar .info { font-size: 12px; color: var(--dim2); white-space: nowrap; }

  .list { flex: 1; overflow-y: auto; padding: 8px 0 40px; }
  .daygroup { padding: 0; }
  .dayhdr {
    position: sticky; top: 0; background: var(--bg); padding: 12px 16px 6px;
    font-size: 12px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 9px 16px;
  }
  .item:active { background: var(--card); }
  .item .fav {
    width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; background: var(--card2);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .item .fav img { width: 18px; height: 18px; }
  .item .body { flex: 1; min-width: 0; }
  .item .t { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .u { font-size: 12px; color: var(--dim2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .time { font-size: 11px; color: var(--dim2); flex-shrink: 0; }

  .empty { text-align: center; color: var(--dim2); padding: 60px 20px; font-size: 14px; }
  .loadbar { height: 2px; background: var(--accent); width: 0; transition: width 0.3s; }

  /* mobile */
  @media (max-width: 720px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; width: 80%; max-width: 300px; z-index: 30;
      background: var(--bg); transform: translateX(-100%); transition: transform 0.25s;
      padding-top: calc(env(safe-area-inset-top) + 10px);
    }
    .sidebar.open { transform: translateX(0); }
    .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 25; }
    .backdrop.show { display: block; }
    #menuBtn { display: inline-flex !important; }
  }
  #menuBtn { display: none; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <h1>🕘 History Sync</h1>
  <div class="sub">Введите данные для доступа к зашифрованной истории на GitHub</div>

  <div class="field">
    <label>GitHub Personal Access Token</label>
    <input id="in-token" type="password" placeholder="github_pat_…" autocomplete="off">
  </div>
  <div class="field field-row">
    <div style="flex:1">
      <label>Владелец (owner)</label>
      <input id="in-owner" placeholder="username" autocomplete="off">
    </div>
    <div style="flex:1">
      <label>Репозиторий</label>
      <input id="in-repo" placeholder="history-sync-data" autocomplete="off">
    </div>
  </div>
  <div class="field">
    <label>Пароль шифрования</label>
    <input id="in-pass" type="password" placeholder="••••••••" autocomplete="off">
  </div>

  <button class="btn-primary" id="loginBtn">Войти и загрузить</button>
  <label class="remember"><input type="checkbox" id="remember" checked> Запомнить на этом устройстве</label>
  <div id="login-error"></div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="loadbar" id="loadbar"></div>
  <header>
    <button id="menuBtn">☰</button>
    <span class="title">🕘 History Sync</span>
    <span class="spacer"></span>
    <span id="totalInfo" style="font-size:12px;color:var(--dim2)"></span>
    <button id="refreshBtn">↻</button>
    <button id="logoutBtn">Выйти</button>
  </header>
  <div class="layout">
    <div class="backdrop" id="backdrop"></div>
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="searchbar">
        <input id="search" placeholder="Поиск по истории…" autocomplete="off">
        <span class="info" id="resultInfo"></span>
      </div>
      <div class="list" id="list">
        <div class="empty">Выберите устройство слева</div>
      </div>
    </div>
  </div>
</div>

<script>
// ====================================================================
//  History Sync — standalone viewer
//  Reads the SAME encrypted files the extension writes to GitHub.
//  Mirrors background.js storage engine exactly (chunks + legacy formats).
// ====================================================================

var GITHUB_API  = 'https://api.github.com';
var SYNC_FOLDER = 'HistorySync';
var LS_KEY      = 'historysync_creds';

var CFG = { token:'', owner:'', repo:'', password:'' };
var DEVICES = [];          // [{deviceId, browser, device, safeId, updatedAt, tabs, count, history}]
var CURRENT = null;        // selected device or '__all__'
var ALL_HISTORY_CACHE = null;

// ---------- crypto (mirror of background.js) ----------
function b64ToBytes(b64) {
  var bin = atob(b64);
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function decryptData(base64, password) {
  var raw = b64ToBytes(base64);
  if (raw.length < 29) throw new Error('short');
  var salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
  var enc = new TextEncoder();
  var mat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:salt, iterations:100000, hash:'SHA-256' },
    mat, { name:'AES-GCM', length:256 }, false, ['decrypt']
  );
  var dec = await crypto.subtle.decrypt({ name:'AES-GCM', iv:iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(dec));
}
function normalizeTime(t) {
  if (!t || t <= 0) return 0;
  if (t >= 946684800000 && t <= 4102444800000) return t;
  if (t >= 946684800    && t <= 4102444800)    return t * 1000;
  if (t > 10000000000000) { var u = t - 11644473600000000; if (u > 0) return u / 1000; }
  return 0;
}

// ---------- GitHub ----------
async function ghReq(url) {
  var resp = await fetch(url, {
    headers: {
      'Authorization': 'token ' + CFG.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }
  });
  if (resp.status === 404) return null;
  if (!resp.ok) throw new Error('GitHub ' + resp.status);
  return resp.json();
}
function ghUrl(name) {
  return GITHUB_API + '/repos/' + CFG.owner + '/' + CFG.repo + '/contents/' + SYNC_FOLDER + '/' + encodeURIComponent(name);
}
async function listSyncFiles() {
  var url = GITHUB_API + '/repos/' + CFG.owner + '/' + CFG.repo + '/contents/' + SYNC_FOLDER;
  var data = await ghReq(url);
  if (!Array.isArray(data)) return [];
  return data.map(function(f){ return { name: f.name, size: f.size, sha: f.sha }; });
}
// Return base64 of raw file bytes (handles >1MB via Blobs API)
async function downloadB64(name, sha) {
  var data = await ghReq(ghUrl(name));
  if (!data) return null;
  if (data.content) return data.content.replace(/\n/g,'');
  var useSha = data.sha || sha;
  if (!useSha) return null;
  var blobUrl = GITHUB_API + '/repos/' + CFG.owner + '/' + CFG.repo + '/git/blobs/' + useSha;
  var resp = await fetch(blobUrl, {
    headers: { 'Authorization':'token '+CFG.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }
  });
  if (!resp.ok) return null;
  var blob = await resp.json();
  return blob && blob.content ? blob.content.replace(/\n/g,'') : null;
}
// Download + decrypt, handling new (single-b64) AND legacy (double-b64) formats
async function downloadDecrypt(name, sha) {
  var b64 = await downloadB64(name, sha);
  if (!b64) return null;
  try { return await decryptData(b64, CFG.password); }
  catch(e) {
    try { return await decryptData(atob(b64), CFG.password); }
    catch(e2) { throw e; }
  }
}

// ---------- device + history file matching (mirror of background.js) ----------
function isDeviceHistoryFile(name, safeId) {
  if (!name || name.slice(-5) !== '.json') return false;
  return name.indexOf('chunk_' + safeId + '_')  === 0 ||
         name.indexOf('history_' + safeId + '_') === 0 ||
         name === 'history_' + safeId + '.json';
}
function safeFileName(id) { return id.replace(/[^a-zA-Z0-9а-яА-ЯёЁ_-]/g, '_'); }

// ---------- UI helpers ----------
function $(id){ return document.getElementById(id); }
function setLoad(pct){ $('loadbar').style.width = (pct||0) + '%'; }

// ---------- login ----------
function loadCreds() {
  try {
    var s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s) { $('in-token').value=s.token||''; $('in-owner').value=s.owner||''; $('in-repo').value=s.repo||''; $('in-pass').value=s.password||''; return s; }
  } catch(e){}
  return null;
}
function saveCreds() {
  if ($('remember').checked) localStorage.setItem(LS_KEY, JSON.stringify(CFG));
  else localStorage.removeItem(LS_KEY);
}

$('loginBtn').addEventListener('click', doLogin);
$('in-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

async function doLogin() {
  CFG.token    = $('in-token').value.trim();
  CFG.owner    = $('in-owner').value.trim();
  CFG.repo     = $('in-repo').value.trim();
  CFG.password = $('in-pass').value;
  $('login-error').textContent = '';

  if (!CFG.token || !CFG.owner || !CFG.repo || !CFG.password) {
    $('login-error').textContent = 'Заполните все поля';
    return;
  }
  $('loginBtn').disabled = true;
  $('loginBtn').textContent = 'Подключение…';

  try {
    // test repo access
    var repo = await ghReq(GITHUB_API + '/repos/' + CFG.owner + '/' + CFG.repo);
    if (!repo || !repo.id) throw new Error('Репозиторий не найден или нет доступа');

    saveCreds();
    $('login').style.display = 'none';
    $('app').style.display = 'flex';
    await loadDevices();
  } catch(e) {
    $('login-error').textContent = '✗ ' + e.message;
  } finally {
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = 'Войти и загрузить';
  }
}

$('logoutBtn').addEventListener('click', function(){
  localStorage.removeItem(LS_KEY);
  location.reload();
});
$('refreshBtn').addEventListener('click', function(){ ALL_HISTORY_CACHE=null; loadDevices(); });
$('menuBtn').addEventListener('click', function(){ $('sidebar').classList.toggle('open'); $('backdrop').classList.toggle('show'); });
$('backdrop').addEventListener('click', function(){ $('sidebar').classList.remove('open'); $('backdrop').classList.remove('show'); });

// ---------- load devices ----------
async function loadDevices() {
  setLoad(10);
  $('sidebar').innerHTML = '<div style="color:var(--dim2);padding:14px;font-size:13px">Загрузка устройств…</div>';
  $('list').innerHTML = '<div class="empty">Загрузка…</div>';

  var files = await listSyncFiles();
  setLoad(30);

  // Devices come from tabs_*.json (have metadata). Also detect devices that only
  // have history files (derive safeId from history_/chunk_ filenames).
  var tabFiles = files.filter(function(f){ return f.name.indexOf('tabs_')===0 && f.name.slice(-5)==='.json'; });

  // map: safeId -> device record
  var devMap = {};

  // 1. from tabs files (rich metadata)
  var tabResults = await Promise.all(tabFiles.map(function(f){
    return downloadDecrypt(f.name, f.sha).catch(function(){ return null; });
  }));
  setLoad(50);
  tabResults.forEach(function(data){
    if (!data || !data.deviceId) return;
    var safeId = safeFileName(data.deviceId);
    devMap[safeId] = {
      deviceId: data.deviceId, browser: data.browser||'', device: data.device||'',
      safeId: safeId, updatedAt: data.updatedAt||0, tabs: data.tabs||[], count: null, history: null
    };
  });

  // 2. from history/chunk files — ensure devices without a tabs file still appear
  var histSafeIds = {};
  files.forEach(function(f){
    var m = f.name.match(/^(?:chunk_|history_)(.+?)_/);
    if (m) histSafeIds[m[1]] = true;
    var m2 = f.name.match(/^history_(.+)\.json$/);
    if (m2 && m2[1].indexOf('_')<0) histSafeIds[m2[1]] = true;
  });
  Object.keys(histSafeIds).forEach(function(safeId){
    if (devMap[safeId]) return;
    // reconstruct a display name from safeId (underscores were separators)
    var disp = safeId.replace(/___/g,' — ').replace(/_/g,' ');
    devMap[safeId] = { deviceId: disp, browser:'', device:'', safeId:safeId, updatedAt:0, tabs:[], count:null, history:null };
  });

  DEVICES = Object.keys(devMap).map(function(k){ return devMap[k]; });
  DEVICES.sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });

  // remember file list for counting
  window.__files = files;

  renderSidebar();
  setLoad(100);
  setTimeout(function(){ setLoad(0); }, 400);

  // auto-select first device, or "all"
  if (DEVICES.length) selectDevice('__all__');
  else $('list').innerHTML = '<div class="empty">Нет данных в репозитории</div>';

  // lazily compute per-device counts
  computeCounts();
}

function browserIcon(name) {
  var b = (name||'').toLowerCase();
  if (b.indexOf('arc')>=0) return '🌈';
  if (b.indexOf('chrome')>=0) return '🟢';
  if (b.indexOf('orion')>=0) return '🪐';
  if (b.indexOf('safari')>=0) return '🧭';
  if (b.indexOf('firefox')>=0) return '🦊';
  if (b.indexOf('edge')>=0) return '🌊';
  if (b.indexOf('dia')>=0) return '💠';
  return '🌐';
}

function renderSidebar() {
  var html = '';
  // All devices
  html += '<div class="dev' + (CURRENT==='__all__'?' active':'') + '" data-id="__all__">' +
          '<span class="icon">🗂</span><div class="meta"><div class="name">Все устройства</div>' +
          '<div class="count" id="cnt-all">—</div></div></div>';
  DEVICES.forEach(function(d){
    html += '<div class="dev' + (CURRENT===d.safeId?' active':'') + '" data-id="'+d.safeId+'">' +
            '<span class="icon">'+browserIcon(d.browser||d.deviceId)+'</span>' +
            '<div class="meta"><div class="name">'+escapeHtml(d.deviceId)+'</div>' +
            '<div class="count" id="cnt-'+d.safeId+'">'+(d.count!=null? d.count.toLocaleString()+' записей':'…')+'</div>' +
            '</div></div>';
  });
  $('sidebar').innerHTML = html;
  Array.prototype.forEach.call($('sidebar').querySelectorAll('.dev'), function(el){
    el.addEventListener('click', function(){
      selectDevice(el.getAttribute('data-id'));
      $('sidebar').classList.remove('open'); $('backdrop').classList.remove('show');
    });
  });
}

// Count records per device (loads history; cached on device object)
async function computeCounts() {
  for (var i=0;i<DEVICES.length;i++) {
    var d = DEVICES[i];
    if (d.count != null) continue;
    try {
      var h = await getDeviceHistory(d.safeId);
      d.count = h.length;
    } catch(e){ d.count = 0; }
    var el = $('cnt-'+d.safeId);
    if (el) el.textContent = d.count.toLocaleString()+' записей';
  }
  var total = DEVICES.reduce(function(s,d){ return s+(d.count||0); },0);
  var ca = $('cnt-all'); if (ca) ca.textContent = total.toLocaleString()+' записей';
  $('totalInfo').textContent = total.toLocaleString()+' записей • '+DEVICES.length+' устр.';
}

// ---------- per-device history (chunks + legacy), deduped ----------
var _histCache = {};
async function getDeviceHistory(safeId) {
  if (_histCache[safeId]) return _histCache[safeId];
  var files = window.__files || await listSyncFiles();
  var mine = files.filter(function(f){ return isDeviceHistoryFile(f.name, safeId); });
  var loaded = await Promise.all(mine.map(function(f){
    return downloadDecrypt(f.name, f.sha).catch(function(){ return null; });
  }));
  var seen = {}, out = [];
  loaded.forEach(function(arr){
    if (!Array.isArray(arr)) return;
    arr.forEach(function(h){
      var url = h.url||''; if (!url) return;
      var vt = normalizeTime(h.visitTime||h.lastVisitTime||0);
      var k = url+':'+vt; if (seen[k]) return; seen[k]=true;
      out.push({ url:url, title:h.title||'', visitTime:vt, device:safeId });
    });
  });
  out.sort(function(a,b){ return b.visitTime-a.visitTime; });
  _histCache[safeId] = out;
  return out;
}

async function getAllHistory() {
  if (ALL_HISTORY_CACHE) return ALL_HISTORY_CACHE;
  var seen={}, out=[];
  for (var i=0;i<DEVICES.length;i++){
    var h = await getDeviceHistory(DEVICES[i].safeId);
    h.forEach(function(it){
      var k = it.url+':'+it.visitTime; if (seen[k]) return; seen[k]=true; out.push(it);
    });
  }
  out.sort(function(a,b){ return b.visitTime-a.visitTime; });
  ALL_HISTORY_CACHE = out;
  return out;
}

// ---------- select + render history ----------
var _viewData = [];
async function selectDevice(id) {
  CURRENT = id;
  renderSidebar();
  $('list').innerHTML = '<div class="empty">Загрузка истории…</div>';
  setLoad(20);
  try {
    _viewData = id==='__all__' ? await getAllHistory() : await getDeviceHistory(id);
  } catch(e) {
    $('list').innerHTML = '<div class="empty">Ошибка: '+escapeHtml(e.message)+'</div>'; setLoad(0); return;
  }
  setLoad(100); setTimeout(function(){setLoad(0);},300);
  renderList(_viewData);
}

var searchTimer=null;
$('search').addEventListener('input', function(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applySearch, 120);
});
function applySearch() {
  var q = $('search').value.trim().toLowerCase();
  if (!q) { renderList(_viewData); return; }
  var filtered = _viewData.filter(function(it){
    return (it.url||'').toLowerCase().indexOf(q)>=0 || (it.title||'').toLowerCase().indexOf(q)>=0;
  });
  renderList(filtered, q);
}

function dayLabel(ts) {
  var d = new Date(ts);
  var today = new Date(); today.setHours(0,0,0,0);
  var yest = new Date(today.getTime() - 86400000);
  var dd = new Date(d); dd.setHours(0,0,0,0);
  if (dd.getTime()===today.getTime()) return 'Сегодня';
  if (dd.getTime()===yest.getTime())  return 'Вчера';
  return d.toLocaleDateString('ru', { day:'numeric', month:'long', year: d.getFullYear()!==today.getFullYear()?'numeric':undefined });
}
function timeLabel(ts){ return new Date(ts).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function hostOf(url){ try { return new URL(url).hostname; } catch(e){ return url; } }

function renderList(data, q) {
  $('resultInfo').textContent = data.length.toLocaleString() + (q?' найдено':' записей');
  if (!data.length) { $('list').innerHTML = '<div class="empty">'+(q?'Ничего не найдено':'История пуста')+'</div>'; return; }

  // Render only first N for performance, then lazy-append on scroll
  var LIMIT = 300;
  var slice = data.slice(0, LIMIT);
  var html = '', lastDay = '';
  slice.forEach(function(it){
    var dl = it.visitTime ? dayLabel(it.visitTime) : 'Без даты';
    if (dl !== lastDay) { html += '<div class="dayhdr">'+dl+'</div>'; lastDay = dl; }
    var host = hostOf(it.url);
    var fav = 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(host)+'&sz=32';
    html += '<a class="item" href="'+escapeHtml(it.url)+'" target="_blank" rel="noopener">' +
            '<span class="fav"><img loading="lazy" src="'+fav+'" onerror="this.style.display=\'none\'"></span>' +
            '<span class="body"><span class="t">'+escapeHtml(it.title||host)+'</span>' +
            '<span class="u">'+escapeHtml(it.url)+'</span></span>' +
            '<span class="time">'+(it.visitTime?timeLabel(it.visitTime):'')+'</span></a>';
  });
  if (data.length > LIMIT) {
    html += '<div class="empty" id="more">Показано '+LIMIT+' из '+data.length.toLocaleString()+' — <a href="#" id="showMore" style="color:var(--accent)">показать ещё</a></div>';
  }
  $('list').innerHTML = html;
  var sm = $('showMore');
  if (sm) sm.addEventListener('click', function(e){ e.preventDefault(); renderListFull(data, q); });
}
function renderListFull(data, q) {
  var html='', lastDay='';
  data.forEach(function(it){
    var dl = it.visitTime ? dayLabel(it.visitTime) : 'Без даты';
    if (dl!==lastDay){ html+='<div class="dayhdr">'+dl+'</div>'; lastDay=dl; }
    var host = hostOf(it.url);
    var fav = 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(host)+'&sz=32';
    html += '<a class="item" href="'+escapeHtml(it.url)+'" target="_blank" rel="noopener">' +
            '<span class="fav"><img loading="lazy" src="'+fav+'" onerror="this.style.display=\'none\'"></span>' +
            '<span class="body"><span class="t">'+escapeHtml(it.title||host)+'</span>' +
            '<span class="u">'+escapeHtml(it.url)+'</span></span>' +
            '<span class="time">'+(it.visitTime?timeLabel(it.visitTime):'')+'</span></a>';
  });
  $('list').innerHTML = html;
}

(function(){
  var saved = loadCreds();
  if (saved && saved.token && saved.owner && saved.repo && saved.password) {
    // auto-login
    CFG = { token:saved.token, owner:saved.owner, repo:saved.repo, password:saved.password };
    $('login').style.display='none'; $('app').style.display='flex';
    loadDevices().catch(function(e){
      $('app').style.display='none'; $('login').style.display='flex';
      $('login-error').textContent = '✗ '+e.message;
    });
  }
})();
</script>
