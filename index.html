<!DOCTYPE html>
<html lang="ru" style="background:#000;color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor.js Demo</title>

<!-- Editor.js Core + Plugins — jsdelivr auto-resolves main entry -->
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/nested-list@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/checklist@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/code@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/warning@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/underline@1"></script>

<style>
:root{--bg:#000;--fg:#fff;--s1:#0a0a0a;--s2:#141414;--s3:#1e1e1e;--line:rgba(255,255,255,.1);--ls:rgba(255,255,255,.22);--dim:rgba(255,255,255,.4);--hov:rgba(255,255,255,.07);--acc:#4fc3f7;--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro','Segoe UI',system-ui,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
::selection{background:rgba(255,255,255,.15)}
html,body{height:100%;background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:14px;display:flex;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}

.wrap{width:100%;max-width:720px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:12px 0}
.head h1{font-size:18px;font-weight:600;flex:1}
.head span{font-size:11px;color:var(--dim)}
.btn{background:var(--s2);border:1px solid var(--line);color:var(--dim);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:11px;font-family:var(--font);transition:all .15s}
.btn:hover{background:var(--s3);color:var(--fg)}
.status{font-size:11px;color:var(--dim);margin-top:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05)}
#loadStatus{font-size:12px;color:var(--acc);padding:10px 0}

/* ── Editor.js dark theme ── */
.codex-editor{color:#fff!important;font-family:var(--font)!important}
.ce-block__content,.ce-toolbar__content{max-width:100%!important}
.codex-editor--narrow .ce-block__content,.codex-editor--narrow .ce-toolbar__content{max-width:100%!important}
.ce-block--focused{background:rgba(255,255,255,.02)}
.ce-paragraph{color:#fff!important;font-size:14px!important;line-height:1.6!important}
.ce-header{color:#fff!important}
.cdx-checklist__item-text{color:#fff!important}
.cdx-checklist__item--checked .cdx-checklist__item-text{color:rgba(255,255,255,.4)!important;text-decoration:line-through}
.cdx-checklist__item-checkbox{background:var(--s3)!important;border-color:rgba(255,255,255,.2)!important}
.cdx-checklist__item--checked .cdx-checklist__item-checkbox{background:var(--acc)!important;border-color:var(--acc)!important}
.ce-code__textarea{background:var(--s2)!important;color:#fff!important;border:1px solid var(--line)!important;border-radius:8px!important;font-family:'SF Mono',Menlo,monospace!important;font-size:13px!important}
.cdx-quote__text{color:#fff!important;border-left:3px solid var(--acc)!important;padding-left:12px!important}
.cdx-quote__caption{color:var(--dim)!important}
.cdx-warning{background:var(--s2)!important;border:1px solid rgba(255,183,77,.2)!important;border-radius:8px!important}
.cdx-warning__title,.cdx-warning__message{color:#fff!important}
.tc-wrap{--color-border:rgba(255,255,255,.12)!important}
.tc-table,.tc-cell{color:#fff!important}.tc-row,.tc-cell{border-color:rgba(255,255,255,.08)!important}
.tc-cell--selected{background:rgba(79,195,247,.08)!important}
.tc-add-row,.tc-add-column{color:var(--dim)!important;background:var(--s2)!important;border-color:var(--line)!important}
.tc-add-row:hover,.tc-add-column:hover{background:var(--s3)!important}
.ce-toolbar__plus,.ce-toolbar__settings-btn{color:var(--dim)!important;background:var(--s2)!important;border:1px solid var(--line)!important;border-radius:6px!important}
.ce-toolbar__plus:hover,.ce-toolbar__settings-btn:hover{background:var(--s3)!important;color:#fff!important}
.ce-popover{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:0 8px 30px rgba(0,0,0,.6)!important}
.ce-popover-item{color:#fff!important;border-radius:6px!important}
.ce-popover-item:hover{background:var(--hov)!important}
.ce-popover-item__icon{background:var(--s3)!important;border:1px solid var(--line)!important;color:var(--dim)!important;border-radius:6px!important}
.ce-popover-item__title{color:#fff!important;font-family:var(--font)!important}
.ce-popover-item__description{color:var(--dim)!important}
.ce-popover__search{background:var(--s2)!important;border:1px solid var(--line)!important;color:#fff!important;border-radius:8px!important}
.ce-popover__search::placeholder{color:var(--dim)!important}
.cdx-search-field{background:var(--s2)!important;border:1px solid var(--line)!important;border-radius:8px!important;color:#fff!important}
.ce-inline-toolbar{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:0 4px 16px rgba(0,0,0,.5)!important}
.ce-inline-tool{color:var(--dim)!important}.ce-inline-tool:hover{background:var(--hov)!important;color:#fff!important}
.ce-inline-tool--active{color:var(--acc)!important}
.ce-inline-toolbar__dropdown{border-color:var(--line)!important}
.ce-conversion-toolbar{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:8px!important}
.ce-conversion-tool{color:#fff!important}.ce-conversion-tool:hover{background:var(--hov)!important}
.ce-conversion-tool__icon{background:var(--s3)!important;color:var(--dim)!important}
.ce-settings{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:8px!important}
.cdx-settings-button{color:var(--dim)!important}.cdx-settings-button:hover{background:var(--hov)!important;color:#fff!important}
.ce-delimiter::before{color:rgba(255,255,255,.2)!important}
.cdx-marker{background:rgba(79,195,247,.15)!important;color:var(--acc)!important}
.ce-block a{color:var(--acc)!important}
.cdx-nested-list__item-content,.cdx-list__item{color:#fff!important}
.codex-editor__redactor{padding-bottom:150px!important}

@media print{body{background:#000}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Editor.js</h1>
    <span>Все плагины</span>
    <button class="btn" onclick="saveAsJson()">💾 JSON</button>
    <button class="btn" onclick="copyAsMd()">📋 MD</button>
  </div>
  <div id="loadStatus"></div>
  <div id="editorjs"></div>
  <div class="status" id="status"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var ls = document.getElementById('loadStatus');

  // Check which scripts loaded
  var loaded = [], failed = [];
  [['EditorJS','EditorJS'],['Header','Header'],['NestedList','NestedList'],['Checklist','Checklist'],
   ['Quote','Quote'],['CodeTool','CodeTool'],['Delimiter','Delimiter'],['Table','Table'],
   ['Warning','Warning'],['Marker','Marker'],['InlineCode','InlineCode'],['Underline','Underline']
  ].forEach(function(p){
    if(typeof window[p[1]]!=='undefined') loaded.push(p[0]); else failed.push(p[0]);
  });

  if(failed.length){
    ls.innerHTML='✅ Загружено: '+loaded.join(', ')+'<br>❌ Не загружено: <span style="color:#e57373">'+failed.join(', ')+'</span>';
  } else {
    ls.innerHTML='✅ Все '+loaded.length+' плагинов загружены';
    setTimeout(function(){ls.style.display='none'},3000);
  }

  if(typeof EditorJS==='undefined'){
    document.getElementById('editorjs').innerHTML='<div style="padding:30px;text-align:center;color:rgba(255,255,255,.4)">Editor.js не загрузился. Проверь консоль (Cmd+Option+C).</div>';
    return;
  }

  // Build tools config only with loaded plugins
  var tools = {};
  if(typeof Header!=='undefined') tools.header={class:Header,inlineToolbar:true,config:{placeholder:'Заголовок',levels:[1,2,3,4],defaultLevel:2}};
  if(typeof NestedList!=='undefined') tools.list={class:NestedList,inlineToolbar:true,config:{defaultStyle:'unordered'}};
  if(typeof Checklist!=='undefined') tools.checklist={class:Checklist,inlineToolbar:true};
  if(typeof Quote!=='undefined') tools.quote={class:Quote,inlineToolbar:true,config:{quotePlaceholder:'Цитата',captionPlaceholder:'Автор'}};
  if(typeof CodeTool!=='undefined') tools.code={class:CodeTool};
  if(typeof Delimiter!=='undefined') tools.delimiter={class:Delimiter};
  if(typeof Table!=='undefined') tools.table={class:Table,inlineToolbar:true,config:{rows:2,cols:3,withHeadings:true}};
  if(typeof Warning!=='undefined') tools.warning={class:Warning,config:{titlePlaceholder:'Заголовок',messagePlaceholder:'Описание'}};
  if(typeof Marker!=='undefined') tools.marker={class:Marker};
  if(typeof InlineCode!=='undefined') tools.inlineCode={class:InlineCode};
  if(typeof Underline!=='undefined') tools.underline={class:Underline};

  var editor = new EditorJS({
    holder:'editorjs',
    placeholder:'Нажми Tab или + слева для меню блоков...',
    autofocus:true,
    tools:tools,
    data:{blocks:[
      {type:'header',data:{text:'Editor.js — полное демо',level:1}},
      {type:'paragraph',data:{text:'Это <b>настоящий</b> Editor.js. Нажми <code class="inline-code">+</code> слева или <code class="inline-code">Tab</code> — откроется меню блоков. Перетаскивай блоки за иконку <b>⠿</b> слева.'}},
      {type:'header',data:{text:'Чеклист',level:2}},
      {type:'checklist',data:{items:[{text:'Посмотреть Editor.js',checked:true},{text:'Интегрировать на страницу',checked:false},{text:'Подключить Firebase',checked:false}]}},
      {type:'header',data:{text:'Вложенный список',level:2}},
      {type:'list',data:{style:'unordered',items:[{content:'Первый пункт',items:[{content:'Вложенный',items:[]},{content:'Ещё один',items:[]}]},{content:'Второй пункт',items:[]},{content:'С <b>форматированием</b>',items:[]}]}},
      {type:'header',data:{text:'Цитата',level:2}},
      {type:'quote',data:{text:'Стартовая страница — это инструмент на 2–3 секунды.',caption:'Из ревью',alignment:'left'}},
      {type:'header',data:{text:'Код',level:2}},
      {type:'code',data:{code:'const editor = new EditorJS({\n  holder: "editorjs",\n  tools: { header: Header }\n});'}},
      {type:'header',data:{text:'Таблица (добавляй строки/колонки!)',level:2}},
      {type:'table',data:{withHeadings:true,content:[['Продукт','Тип','Лицензия'],['Editor.js','Блочный редактор','Apache 2.0'],['FullCalendar','Календарь','MIT']]}},
      {type:'header',data:{text:'Предупреждение',level:2}},
      {type:'warning',data:{title:'Важно',message:'На Spark плане нет Cloud Storage. Для картинок нужен Blaze.'}},
      {type:'delimiter',data:{}},
      {type:'header',data:{text:'Inline-форматирование',level:2}},
      {type:'paragraph',data:{text:'Выдели текст → тулбар: <b>Bold</b>, <i>Italic</i>, <u>Underline</u>, <mark class="cdx-marker">Маркер</mark>, <code class="inline-code">Inline Code</code>, ссылка. Конвертируй блок через ⚙️.'}},
      {type:'delimiter',data:{}},
      {type:'paragraph',data:{text:'👆 Попробуй: + слева, Tab, drag блоков за ⠿, ⚙️ для настроек блока.'}}
    ]},
    onReady:function(){document.getElementById('status').textContent='Editor.js готов. Плагинов: '+Object.keys(tools).length},
    onChange:function(){}
  });
  window._editor=editor;

  // Export functions
  window.saveAsJson=function(){
    editor.save().then(function(data){
      var json=JSON.stringify(data,null,2);
      navigator.clipboard.writeText(json).then(function(){
        document.getElementById('status').textContent='✅ JSON скопирован в буфер ('+data.blocks.length+' блоков)';
      });
    });
  };
  window.copyAsMd=function(){
    editor.save().then(function(data){
      var md=data.blocks.map(function(b){
        var d=b.data,t=b.type;
        if(t==='header')return'#'.repeat(d.level)+' '+stripHtml(d.text);
        if(t==='paragraph')return stripHtml(d.text);
        if(t==='checklist')return d.items.map(function(i){return(i.checked?'- [x] ':'- [ ] ')+stripHtml(i.text)}).join('\n');
        if(t==='list')return flatList(d.items,d.style==='ordered').join('\n');
        if(t==='quote')return'> '+stripHtml(d.text)+(d.caption?'\n> — '+stripHtml(d.caption):'');
        if(t==='code')return'```\n'+d.code+'\n```';
        if(t==='delimiter')return'---';
        if(t==='warning')return'⚠️ **'+stripHtml(d.title)+'**\n'+stripHtml(d.message);
        if(t==='table')return d.content.map(function(r){return'| '+r.join(' | ')+' |'}).join('\n');
        return stripHtml(d.text||'');
      }).join('\n\n');
      navigator.clipboard.writeText(md).then(function(){
        document.getElementById('status').textContent='✅ Markdown скопирован в буфер';
      });
    });
  };
  function stripHtml(s){return(s||'').replace(/<b>(.*?)<\/b>/g,'**$1**').replace(/<i>(.*?)<\/i>/g,'*$1*').replace(/<code[^>]*>(.*?)<\/code>/g,'`$1`').replace(/<mark[^>]*>(.*?)<\/mark>/g,'==$1==').replace(/<u>(.*?)<\/u>/g,'__$1__').replace(/<[^>]*>/g,'')}
  function flatList(items,ord,depth){depth=depth||0;var pre='  '.repeat(depth);return items.reduce(function(a,it,i){a.push(pre+(ord?(i+1)+'. ':'- ')+stripHtml(it.content));if(it.items&&it.items.length)a=a.concat(flatList(it.items,ord,depth+1));return a},[])}
});
</script>
</body>
</html>
