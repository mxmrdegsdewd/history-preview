<!DOCTYPE html>
<html lang="ru" style="background:#000;color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor.js + Sortable Tree Demo</title>

<!-- Editor.js Core -->
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@2.30.8/dist/editorjs.umd.bundle.min.js"></script>
<!-- Editor.js Plugins -->
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2.8.8/dist/header.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@2.0.8/dist/list.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/checklist@1.6.0/dist/checklist.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@2.7.6/dist/quote.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/code@2.9.3/dist/code.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@1.4.2/dist/delimiter.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2.4.3/dist/table.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/warning@1.4.1/dist/warning.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@1.4.0/dist/marker.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@1.5.1/dist/inline-code.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/underline@1.1.0/dist/underline.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/nested-list@1.4.3/dist/nested-list.umd.js"></script>

<!-- Sortable Tree -->
<script src="https://cdn.jsdelivr.net/npm/sortable-tree@3.1.0/dist/sortable-tree.umd.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sortable-tree@3.1.0/dist/sortable-tree.min.css">

<style>
:root{--bg:#000;--fg:#fff;--s1:#0a0a0a;--s2:#141414;--s3:#1e1e1e;--line:rgba(255,255,255,.1);--ls:rgba(255,255,255,.22);--dim:rgba(255,255,255,.4);--hov:rgba(255,255,255,.07);--acc:#4fc3f7;--a2:rgba(79,195,247,.12);--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro','Segoe UI',system-ui,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
::selection{background:rgba(255,255,255,.15)}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:14px;display:flex;align-items:center;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:1100px;display:grid;grid-template-columns:1fr 1.4fr;gap:10px;height:min(680px,88vh)}

/* Panels */
.pnl{background:var(--bg);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.ph{padding:12px 18px 8px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.ph span{font-size:11px;font-weight:400;color:rgba(255,255,255,.2)}
.pbody{flex:1;overflow-y:auto;padding:12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
.pbody::-webkit-scrollbar{width:4px}
.pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

/* ── Sortable Tree Override (dark theme) ── */
.sortable-tree{--st-font-family:var(--font);--st-color:#fff;--st-background:transparent;--st-border-color:rgba(255,255,255,.08);--st-hover-background:rgba(255,255,255,.07);--st-selected-background:rgba(79,195,247,.12);--st-indent:16px;--st-row-height:32px;--st-font-size:13px}
.sortable-tree-node{border-radius:8px!important;margin-bottom:1px!important}
.sortable-tree-node:hover{background:rgba(255,255,255,.05)!important}
.sortable-tree-node-label{color:#fff!important;font-size:13px!important;font-family:var(--font)!important;padding:6px 8px!important}
.sortable-tree-node-toggle{color:rgba(255,255,255,.4)!important}
.sortable-tree-placeholder{background:rgba(79,195,247,.08)!important;border:2px dashed rgba(79,195,247,.3)!important;border-radius:8px!important;min-height:32px!important}
.sortable-tree-drag-ghost{background:var(--s2)!important;border:1px solid var(--ls)!important;border-radius:8px!important;box-shadow:0 8px 24px rgba(0,0,0,.5)!important;color:#fff!important;font-family:var(--font)!important;padding:6px 12px!important}
.sortable-tree-line{background:var(--acc)!important;height:3px!important;border-radius:2px!important;box-shadow:0 0 6px rgba(79,195,247,.4)!important}

/* ── Editor.js Override (dark theme) ── */
.codex-editor{color:#fff!important;font-family:var(--font)!important}
.ce-block__content,.ce-toolbar__content{max-width:100%!important}
.codex-editor--narrow .ce-block__content,.codex-editor--narrow .ce-toolbar__content{max-width:100%!important}
.ce-block{border-radius:4px}
.ce-block--focused{background:rgba(255,255,255,.02)}
.ce-paragraph{color:#fff!important;font-size:14px!important;line-height:1.6!important}
.ce-header{color:#fff!important}
.cdx-checklist__item-text{color:#fff!important}
.cdx-checklist__item--checked .cdx-checklist__item-text{color:rgba(255,255,255,.4)!important;text-decoration:line-through}
.cdx-checklist__item-checkbox{background:var(--s3)!important;border-color:rgba(255,255,255,.2)!important}
.cdx-checklist__item--checked .cdx-checklist__item-checkbox{background:var(--acc)!important;border-color:var(--acc)!important}
.ce-code__textarea{background:var(--s2)!important;color:#fff!important;border:1px solid var(--line)!important;border-radius:8px!important;font-family:'SF Mono',Menlo,monospace!important;font-size:13px!important}
.cdx-quote__text{color:#fff!important;border-left:3px solid var(--acc)!important;padding-left:12px!important}
.cdx-quote__caption{color:var(--dim)!important}
.cdx-warning{background:var(--s2)!important;border:1px solid rgba(255,183,77,.2)!important;border-radius:8px!important}
.cdx-warning__title,.cdx-warning__message{color:#fff!important}
.tc-wrap{--color-border:rgba(255,255,255,.12)!important}
.tc-table{color:#fff!important}
.tc-row{border-color:rgba(255,255,255,.08)!important}
.tc-cell{border-color:rgba(255,255,255,.08)!important;color:#fff!important}
.tc-cell--selected{background:rgba(79,195,247,.08)!important}
.tc-add-row,.tc-add-column{color:var(--dim)!important;background:var(--s2)!important;border-color:var(--line)!important}
.tc-add-row:hover,.tc-add-column:hover{background:var(--s3)!important}
.ce-toolbar__plus,.ce-toolbar__settings-btn{color:var(--dim)!important;background:var(--s2)!important;border:1px solid var(--line)!important;border-radius:6px!important}
.ce-toolbar__plus:hover,.ce-toolbar__settings-btn:hover{background:var(--s3)!important;color:#fff!important}
.ce-popover{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:0 8px 30px rgba(0,0,0,.6)!important}
.ce-popover-item{color:#fff!important;border-radius:6px!important}
.ce-popover-item:hover{background:var(--hov)!important}
.ce-popover-item__icon{background:var(--s3)!important;border:1px solid var(--line)!important;color:var(--dim)!important;border-radius:6px!important}
.ce-popover-item__title{color:#fff!important;font-family:var(--font)!important}
.ce-popover-item__description{color:var(--dim)!important}
.ce-popover__search{background:var(--s2)!important;border:1px solid var(--line)!important;color:#fff!important;border-radius:8px!important}
.ce-popover__search::placeholder{color:var(--dim)!important}
.cdx-search-field{background:var(--s2)!important;border:1px solid var(--line)!important;border-radius:8px!important;color:#fff!important}
.ce-inline-toolbar{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:0 4px 16px rgba(0,0,0,.5)!important}
.ce-inline-tool{color:var(--dim)!important}.ce-inline-tool:hover{background:var(--hov)!important;color:#fff!important}
.ce-inline-tool--active{color:var(--acc)!important}
.ce-inline-toolbar__dropdown{border-color:var(--line)!important}
.ce-conversion-toolbar{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:8px!important}
.ce-conversion-tool{color:#fff!important}.ce-conversion-tool:hover{background:var(--hov)!important}
.ce-conversion-tool__icon{background:var(--s3)!important;color:var(--dim)!important}
.ce-settings{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:8px!important}
.cdx-settings-button{color:var(--dim)!important}.cdx-settings-button:hover{background:var(--hov)!important;color:#fff!important}
.ce-delimiter::before{color:rgba(255,255,255,.2)!important}
.cdx-marker{background:rgba(79,195,247,.15)!important;color:var(--acc)!important}
.cdx-underline{text-decoration-color:var(--acc)!important}
.ce-block a{color:var(--acc)!important}
/* nested list */
.cdx-nested-list__item-content{color:#fff!important}
.cdx-list__item{color:#fff!important}

/* Scrollbar for editor */
.codex-editor__redactor{padding-bottom:200px!important}

@media(max-width:700px){.app{grid-template-columns:1fr;height:auto;max-height:92vh}.pnl{min-height:320px}}
@media print{body{background:#000}.app{height:auto}}
</style>
</head>
<body>

<div class="app">
  <!-- LEFT: Sortable Tree -->
  <div class="pnl">
    <div class="ph">Проводник <span>sortable-tree</span></div>
    <div class="pbody" id="treeRoot"></div>
  </div>

  <!-- RIGHT: Editor.js -->
  <div class="pnl">
    <div class="ph">Заметки <span>editor.js + все плагины</span></div>
    <div class="pbody">
      <div id="editorjs"></div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   SORTABLE TREE
   ═══════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', function() {

  // Check if SortableTree loaded
  if (typeof SortableTree !== 'undefined') {
    var treeData = [
      { data: { title: 'Работа', icon: '📁' }, nodes: [
        { data: { title: 'Jira', icon: '🔗', url: 'https://jira.com' }, nodes: [] },
        { data: { title: 'Confluence', icon: '🔗', url: 'https://confluence.com' }, nodes: [] },
        { data: { title: 'Figma', icon: '🎨', url: 'https://figma.com' }, nodes: [] }
      ]},
      { data: { title: 'Учёба', icon: '📁' }, nodes: [
        { data: { title: 'Яндекс Практикум', icon: '🔗', url: 'https://practicum.yandex.ru' }, nodes: [] },
        { data: { title: 'MDN Web Docs', icon: '🔗', url: 'https://developer.mozilla.org' }, nodes: [] }
      ]},
      { data: { title: 'Музыка', icon: '📁' }, nodes: [
        { data: { title: 'Beatport', icon: '🎵', url: 'https://beatport.com' }, nodes: [] },
        { data: { title: 'Spotify', icon: '🎵', url: 'https://open.spotify.com' }, nodes: [] },
        { data: { title: 'Плейлисты', icon: '📁' }, nodes: [
          { data: { title: 'Deep House', icon: '🎧' }, nodes: [] },
          { data: { title: 'Techno', icon: '🎧' }, nodes: [] },
          { data: { title: 'Архив', icon: '📁' }, nodes: [
            { data: { title: 'Old mix 2024', icon: '💿' }, nodes: [] }
          ]}
        ]}
      ]},
      { data: { title: 'Соцсети', icon: '📁' }, nodes: [
        { data: { title: 'Instagram', icon: '📷', url: 'https://instagram.com' }, nodes: [] },
        { data: { title: 'Telegram', icon: '✈️', url: 'https://web.telegram.org' }, nodes: [] },
        { data: { title: 'VK', icon: '🔵', url: 'https://vk.com' }, nodes: [] }
      ]}
    ];

    new SortableTree({
      nodes: treeData,
      element: document.getElementById('treeRoot'),
      stateId: 'demo-tree',
      initCollapseLevel: 2,
      renderLabel: function(data) {
        var icon = data.icon || '📄';
        var title = data.title || 'Untitled';
        return '<span style="display:flex;align-items:center;gap:6px;width:100%">' +
          '<span style="font-size:14px">' + icon + '</span>' +
          '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + title + '</span>' +
          '</span>';
      },
      onChange: function(info) {
        console.log('Tree changed:', info.movedNode.data);
      },
      onClick: function(event, node) {
        if (node.data.url) {
          window.open(node.data.url, '_blank');
        }
      }
    });
  } else {
    document.getElementById('treeRoot').innerHTML = '<div style="padding:20px;color:rgba(255,255,255,.4);font-size:13px;text-align:center">sortable-tree не загрузился.<br>Откройте файл через локальный сервер<br>или напрямую в Safari.</div>';
  }

  /* ═══════════════════════════════════════════
     EDITOR.JS
     ═══════════════════════════════════════════ */
  if (typeof EditorJS !== 'undefined') {
    var editor = new EditorJS({
      holder: 'editorjs',
      placeholder: 'Начните писать или нажмите Tab для меню...',
      autofocus: true,
      tools: {
        header: {
          class: Header,
          inlineToolbar: true,
          config: {
            placeholder: 'Заголовок',
            levels: [1, 2, 3, 4],
            defaultLevel: 2
          }
        },
        list: {
          class: NestedList || List,
          inlineToolbar: true,
          config: {
            defaultStyle: 'unordered'
          }
        },
        checklist: {
          class: Checklist,
          inlineToolbar: true
        },
        quote: {
          class: Quote,
          inlineToolbar: true,
          config: {
            quotePlaceholder: 'Введите цитату',
            captionPlaceholder: 'Автор'
          }
        },
        code: {
          class: CodeTool
        },
        delimiter: {
          class: Delimiter
        },
        table: {
          class: Table,
          inlineToolbar: true,
          config: {
            rows: 2,
            cols: 3,
            withHeadings: true
          }
        },
        warning: {
          class: Warning,
          config: {
            titlePlaceholder: 'Заголовок',
            messagePlaceholder: 'Описание'
          }
        },
        marker: {
          class: Marker
        },
        inlineCode: {
          class: InlineCode
        },
        underline: {
          class: Underline
        }
      },
      data: {
        blocks: [
          { type: 'header', data: { text: 'Editor.js — полное демо', level: 1 } },
          { type: 'paragraph', data: { text: 'Это <b>настоящий</b> Editor.js со <mark class="cdx-marker">всеми плагинами</mark>. Ниже — примеры каждого типа блока.' } },

          { type: 'header', data: { text: 'Заголовки (H1–H4)', level: 2 } },
          { type: 'paragraph', data: { text: 'Поддерживаются уровни от H1 до H4. Переключай через меню блока (⚙️ справа).' } },

          { type: 'header', data: { text: 'Чеклист', level: 2 } },
          { type: 'checklist', data: { items: [
            { text: 'Посмотреть Editor.js', checked: true },
            { text: 'Посмотреть sortable-tree', checked: true },
            { text: 'Интегрировать в свою страницу', checked: false },
            { text: 'Подключить Firebase синхронизацию', checked: false }
          ]}},

          { type: 'header', data: { text: 'Список (вложенный)', level: 2 } },
          { type: 'list', data: { style: 'unordered', items: [
            { content: 'Первый пункт', items: [
              { content: 'Вложенный пункт', items: [] },
              { content: 'Ещё один', items: [] }
            ]},
            { content: 'Второй пункт', items: [] },
            { content: 'Третий — с <b>форматированием</b>', items: [] }
          ]}},

          { type: 'header', data: { text: 'Цитата', level: 2 } },
          { type: 'quote', data: { text: 'Стартовая страница — это инструмент на 2–3 секунды. Всё, что требует скроллинга, кликов по папкам — это уже приложение.', caption: 'Из ревью', alignment: 'left' } },

          { type: 'header', data: { text: 'Код', level: 2 } },
          { type: 'code', data: { code: 'const editor = new EditorJS({\n  holder: "editorjs",\n  tools: { header: Header, list: List }\n});' } },

          { type: 'header', data: { text: 'Таблица', level: 2 } },
          { type: 'paragraph', data: { text: 'Можно добавлять/удалять строки и колонки. Наведи на край таблицы — появятся кнопки +.' } },
          { type: 'table', data: { withHeadings: true, content: [
            ['Продукт', 'Тип', 'Лицензия'],
            ['Editor.js', 'Блочный редактор', 'Apache 2.0'],
            ['sortable-tree', 'Дерево', 'MIT'],
            ['FullCalendar', 'Календарь', 'MIT']
          ]}},

          { type: 'header', data: { text: 'Предупреждение (Warning)', level: 2 } },
          { type: 'warning', data: { title: 'Важно', message: 'На Spark плане Firebase нет Cloud Storage. Для картинок нужен Blaze план.' } },

          { type: 'delimiter', data: {} },

          { type: 'header', data: { text: 'Inline-форматирование', level: 2 } },
          { type: 'paragraph', data: { text: 'Выдели текст — появится тулбар: <b>Bold</b>, <i>Italic</i>, <u>Underline</u>, <mark class="cdx-marker">Маркер</mark>, <code class="inline-code">Inline Code</code>, ссылка. Также можно конвертировать блок в другой тип через меню (⚙️).' } },

          { type: 'header', data: { text: 'Разделитель', level: 3 } },
          { type: 'paragraph', data: { text: 'Три звёздочки выше — это блок Delimiter. Визуально разделяет секции.' } },

          { type: 'delimiter', data: {} },

          { type: 'paragraph', data: { text: '👆 Попробуй: нажми + слева или Tab — откроется меню всех блоков. Drag & drop блоков работает через иконку ⠿ слева от каждого блока.' } }
        ]
      },
      onReady: function() {
        console.log('Editor.js is ready');
      },
      onChange: function(api, event) {
        // Здесь можно сохранять в Firebase
        // api.saver.save().then(data => { firebase.set(data) })
      }
    });

    // Expose for console testing
    window._editor = editor;

  } else {
    document.getElementById('editorjs').innerHTML = '<div style="padding:20px;color:rgba(255,255,255,.4);font-size:13px;text-align:center">Editor.js не загрузился.<br>Откройте файл через локальный сервер<br>или напрямую в Safari.</div>';
  }
});
</script>
</body>
</html>
