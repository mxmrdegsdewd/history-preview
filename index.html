<html lang="ru" style="background:#000;color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проводник и Заметки</title>

<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/nested-list@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/checklist@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/code@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/warning@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/underline@1"></script>

<style>
:root{--bg:#000;--fg:#fff;--s1:#0a0a0a;--s2:#141414;--s3:#1e1e1e;--line:rgba(255,255,255,.1);--ls:rgba(255,255,255,.22);--dim:rgba(255,255,255,.4);--hov:rgba(255,255,255,.07);--acc:#4fc3f7;--a2:rgba(79,195,247,.15);--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro','Segoe UI',system-ui,sans-serif;--fs:14px;--rl:18px;--rs:8px;--rx:4px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}::selection{background:rgba(255,255,255,.15)}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:var(--fs);display:flex;align-items:center;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:1100px;display:grid;grid-template-columns:1fr 1.3fr;gap:10px;height:min(660px,86vh)}
button{font-family:var(--font)}
.pnl{background:var(--bg);border:1px solid var(--line);border-radius:var(--rl);display:flex;flex-direction:column;overflow:hidden;position:relative}
.ph{display:flex;align-items:center;gap:6px;padding:11px 16px 7px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.05)}
.pt{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;padding:4px 9px;border-radius:14px;transition:all .15s;background:none;border:none}.pt:hover{background:var(--hov);color:var(--fg)}.pt.on{color:var(--fg);background:var(--hov)}
.pb{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}.pb::-webkit-scrollbar{width:4px}.pb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.pf{display:flex;align-items:center;gap:4px;padding:7px 12px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0}
.ib{background:none;border:none;color:var(--dim);cursor:pointer;padding:5px;border-radius:6px;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}.ib:hover{background:var(--hov);color:var(--fg)}.ib svg{width:15px;height:15px}.sp{flex:1}

/* TREE */
.tree{padding:4px 6px;user-select:none}
.trow{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:var(--rs);cursor:grab;transition:background .12s;position:relative;min-height:30px}
.trow:hover{background:var(--hov)}.trow:active{cursor:grabbing}.trow.dragging-row{opacity:.15}
.trow .arr{width:11px;height:11px;transition:transform .2s cubic-bezier(.34,1.3,.64,1);flex-shrink:0;color:var(--dim);cursor:pointer}.trow .arr.open{transform:rotate(90deg)}
.trow .fi{width:13px;height:13px;flex-shrink:0;color:var(--dim)}
.trow .fav{width:15px;height:15px;border-radius:3px;background:var(--s3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--dim)}
.trow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;cursor:grab}
.trow .cnt{font-size:10px;color:rgba(255,255,255,.2);flex-shrink:0;transition:opacity .12s}
.trow .acts{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity .12s;pointer-events:none}
.trow:hover .acts{opacity:1;pointer-events:auto}.trow:hover .cnt{opacity:0}
.act{background:none;border:none;color:var(--dim);cursor:pointer;padding:3px;border-radius:3px;transition:all .1s;display:flex;align-items:center}.act:hover{background:rgba(255,255,255,.1);color:var(--fg)}.act svg{width:12px;height:12px}
.ti-edit{background:none;border:none;border-bottom:1px solid var(--acc);color:var(--fg);font-size:13px;font-family:var(--font);outline:none;flex:1;min-width:0;padding:0 0 1px;cursor:text}
.tch{overflow:hidden;padding-left:14px}
.drop-bar{height:3px;margin:0 4px;border-radius:2px;background:var(--acc);opacity:0;transition:opacity .08s;pointer-events:none;box-shadow:0 0 6px rgba(79,195,247,.4)}.drop-bar.vis{opacity:1}
.trow.drop-on{background:var(--a2);box-shadow:inset 0 0 0 1px rgba(79,195,247,.25)}
.ghost{position:fixed;pointer-events:none;z-index:999;background:var(--s2);border:1px solid var(--ls);border-radius:var(--rs);padding:4px 10px;font-size:12px;color:var(--fg);box-shadow:0 8px 20px rgba(0,0,0,.5);display:flex;align-items:center;gap:5px;opacity:.9;white-space:nowrap;max-width:200px;overflow:hidden}
.sov{position:absolute;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);z-index:10;display:none;flex-direction:column;padding:10px;border-radius:var(--rl)}.sov.open{display:flex}
.sinp{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:var(--rs);padding:8px 11px;color:var(--fg);font-size:13px;font-family:var(--font);outline:none}.sinp::placeholder{color:var(--dim)}.sinp:focus{border-color:var(--ls)}
.sres{flex:1;overflow-y:auto;margin-top:6px}
.apop{position:absolute;bottom:40px;left:10px;right:10px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:20;display:none;flex-direction:column;gap:7px;box-shadow:0 8px 24px rgba(0,0,0,.6)}.apop.open{display:flex}
.apop label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.apop input{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:var(--rs);padding:6px 9px;color:var(--fg);font-size:12px;font-family:var(--font);outline:none}.apop input:focus{border-color:var(--ls)}
.rw{display:flex;gap:5px}
.ab{flex:1;padding:6px;border-radius:var(--rs);border:1px solid var(--line);background:var(--s2);color:var(--fg);cursor:pointer;font-size:11px;font-family:var(--font);text-align:center}.ab:hover{background:var(--s3)}.ab.p{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* NOTES */
.nw{display:flex;flex:1;overflow:hidden;position:relative}
.nl{width:170px;min-width:80px;flex-shrink:0;overflow-y:auto;padding:5px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}.nl::-webkit-scrollbar{width:3px}.nl::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.rh{width:5px;cursor:col-resize;background:transparent;flex-shrink:0;position:relative;z-index:2;transition:background .15s}.rh:hover,.rh.on{background:rgba(79,195,247,.3)}.rh::after{content:'';position:absolute;top:0;bottom:0;left:2px;width:1px;background:rgba(255,255,255,.05)}
.ni{padding:7px 9px;border-radius:var(--rs);cursor:pointer;transition:background .12s;margin-bottom:2px}
.ni:hover{background:var(--hov)}.ni.sel{background:var(--a2)}
.ni .nt{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:1px}
.ni .np{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .nd{font-size:9px;color:rgba(255,255,255,.18);margin-top:2px}
.ne{flex:1;overflow-y:auto;padding:8px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}.ne::-webkit-scrollbar{width:4px}.ne::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.ne-empty{color:var(--dim);padding:40px 16px;text-align:center;font-size:12px}
.cal-pop{position:absolute;bottom:40px;right:10px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:20;display:none;box-shadow:0 8px 24px rgba(0,0,0,.6);width:220px}.cal-pop.open{display:block}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.cal-head span{font-size:12px;font-weight:500}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}.cg .cd{font-size:9px;color:var(--dim);padding:3px}.cg .cn{font-size:11px;padding:4px;border-radius:3px;cursor:pointer;transition:background .1s}.cg .cn:hover{background:var(--hov)}.cg .cn.today{background:var(--a2);color:var(--acc);font-weight:600}.cg .cn.has{color:var(--fg);font-weight:500}.cg .cn.ot{color:rgba(255,255,255,.12)}
.lbl{font-size:11px;color:var(--dim);padding:2px 7px;border-radius:10px;border:1px solid var(--line);background:var(--s2);cursor:pointer;transition:all .15s;white-space:nowrap}.lbl:hover{background:var(--s3);color:var(--fg)}

/* Editor.js dark overrides */
.codex-editor{color:#fff!important;font-family:var(--font)!important}
.ce-block__content,.ce-toolbar__content{max-width:100%!important}
.codex-editor--narrow .ce-block__content,.codex-editor--narrow .ce-toolbar__content{max-width:100%!important}
.ce-block--focused{background:rgba(255,255,255,.02)}
.ce-paragraph{color:#fff!important;font-size:14px!important;line-height:1.6!important}
.ce-header{color:#fff!important}
.cdx-checklist__item-text{color:#fff!important}
.cdx-checklist__item--checked .cdx-checklist__item-text{color:rgba(255,255,255,.4)!important;text-decoration:line-through}
.cdx-checklist__item-checkbox{background:var(--s3)!important;border-color:rgba(255,255,255,.2)!important}
.cdx-checklist__item--checked .cdx-checklist__item-checkbox{background:var(--acc)!important;border-color:var(--acc)!important}
.ce-code__textarea{background:var(--s2)!important;color:#fff!important;border:1px solid var(--line)!important;border-radius:8px!important;font-family:'SF Mono',Menlo,monospace!important;font-size:13px!important}
.cdx-quote__text{color:#fff!important;border-left:3px solid var(--acc)!important;padding-left:12px!important}
.cdx-quote__caption{color:var(--dim)!important}
.cdx-warning{background:var(--s2)!important;border:1px solid rgba(255,183,77,.2)!important;border-radius:8px!important}
.cdx-warning__title,.cdx-warning__message{color:#fff!important}
.tc-wrap{--color-border:rgba(255,255,255,.12)!important}.tc-table,.tc-cell{color:#fff!important}.tc-row,.tc-cell{border-color:rgba(255,255,255,.08)!important}
.tc-cell--selected{background:rgba(79,195,247,.08)!important}
.tc-add-row,.tc-add-column{color:var(--dim)!important;background:var(--s2)!important;border-color:var(--line)!important}
.tc-add-row:hover,.tc-add-column:hover{background:var(--s3)!important}
.ce-toolbar__plus,.ce-toolbar__settings-btn{color:var(--dim)!important;background:var(--s2)!important;border:1px solid var(--line)!important;border-radius:6px!important}
.ce-toolbar__plus:hover,.ce-toolbar__settings-btn:hover{background:var(--s3)!important;color:#fff!important}
.ce-popover{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:0 8px 30px rgba(0,0,0,.6)!important}
.ce-popover-item{color:#fff!important;border-radius:6px!important}.ce-popover-item:hover{background:var(--hov)!important}
.ce-popover-item__icon{background:var(--s3)!important;border:1px solid var(--line)!important;color:var(--dim)!important;border-radius:6px!important}
.ce-popover-item__title{color:#fff!important}.ce-popover-item__description{color:var(--dim)!important}
.ce-popover__search{background:var(--s2)!important;border:1px solid var(--line)!important;color:#fff!important;border-radius:8px!important}
.ce-popover__search::placeholder{color:var(--dim)!important}
.ce-inline-toolbar{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:0 4px 16px rgba(0,0,0,.5)!important}
.ce-inline-tool{color:var(--dim)!important}.ce-inline-tool:hover{background:var(--hov)!important;color:#fff!important}
.ce-inline-tool--active{color:var(--acc)!important}
.ce-conversion-toolbar{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:8px!important}
.ce-conversion-tool{color:#fff!important}.ce-conversion-tool:hover{background:var(--hov)!important}
.ce-settings{background:var(--s1)!important;border:1px solid var(--line)!important;border-radius:8px!important}
.cdx-settings-button{color:var(--dim)!important}.cdx-settings-button:hover{background:var(--hov)!important;color:#fff!important}
.ce-delimiter::before{color:rgba(255,255,255,.2)!important}
.cdx-marker{background:rgba(79,195,247,.15)!important;color:var(--acc)!important}
.ce-block a{color:var(--acc)!important}
.cdx-nested-list__item-content,.cdx-list__item{color:#fff!important}
.codex-editor__redactor{padding-bottom:80px!important}

@media(max-width:700px){.app{grid-template-columns:1fr;height:auto;max-height:92vh}.pnl{min-height:300px}.nl{width:130px;min-width:80px}}
</style>
</head>
<body>
<div class="app">
<!-- LEFT: TREE -->
<div class="pnl" id="xp">
<div class="ph"><span class="pt on">Закладки</span></div>

<button class="ib" onclick="xSo()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></button>
<button class="ib" onclick="xAd('f')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg></button>
<button class="ib" onclick="xAd('b')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
<span class="sp"></span></div>
<div class="sov" id="xSov"><input class="sinp" id="xSI" placeholder="Поиск..." oninput="xDS(this.value)" onkeydown="if(event.key==='Escape')xCS()"><div class="sres" id="xSR"></div></div>
<div class="apop" id="xAP"><label id="xAL">Новая папка</label><input id="xAN" placeholder="Название" onkeydown="if(event.key==='Enter')xDA();if(event.key==='Escape')xCA()"><input id="xAU" placeholder="https://..." style="display:none" onkeydown="if(event.key==='Enter')xDA();if(event.key==='Escape')xCA()"><div class="rw"><button class="ab" onclick="xCA()">Отмена</button><button class="ab p" onclick="xDA()">OK</button></div></div>
</div>

<div class="pnl" id="np">

<span class="sp"></span>
<input class="sinp" id="nSI" placeholder="Поиск..." style="width:100px;padding:4px 8px;font-size:11px" oninput="nFi(this.value)">
</div>

</div>

<button class="ib" onclick="nDl()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>
<span class="sp"></span>

</div>

</div>

<script>
var $=document.getElementById.bind(document),q=function(s){return document.querySelector(s)},qa=function(s){return Array.from(document.querySelectorAll(s))};
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var _i=200;function uid(){return'z'+(_i++)}
function pad(n){return n<10?'0'+n:''+n}
var PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';
var XX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
var ARR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>';
var FOL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>';

/* ═══ TREE (custom, same as v5) ═══ */
var T=[
  {id:'f1',t:'f',n:'Работа',o:true,ch:[{id:'b1',t:'b',n:'Jira',u:'https://jira.com'},{id:'b2',t:'b',n:'Confluence',u:'https://confluence.com'},{id:'b3',t:'b',n:'Figma',u:'https://figma.com'}]},
  {id:'f2',t:'f',n:'Учёба',o:false,ch:[{id:'b4',t:'b',n:'Яндекс Практикум',u:'https://practicum.yandex.ru'},{id:'b5',t:'b',n:'MDN',u:'https://developer.mozilla.org'}]},
  {id:'f3',t:'f',n:'Музыка',o:true,ch:[{id:'b6',t:'b',n:'Beatport',u:'https://beatport.com'},{id:'b7',t:'b',n:'Spotify',u:'https://open.spotify.com'},{id:'f4',t:'f',n:'Плейлисты',o:false,ch:[{id:'b9',t:'b',n:'Deep House',u:'#'},{id:'b10',t:'b',n:'Techno',u:'#'},{id:'f6',t:'f',n:'Архив',o:false,ch:[{id:'b14',t:'b',n:'Old mix',u:'#'}]}]}]},
  {id:'f5',t:'f',n:'Соцсети',o:false,ch:[{id:'b11',t:'b',n:'Instagram',u:'https://instagram.com'},{id:'b12',t:'b',n:'Telegram',u:'https://web.telegram.org'},{id:'b13',t:'b',n:'VK',u:'https://vk.com'}]}
];
var eId=null;
function fN(a,id){for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i];if(a[i].ch){var r=fN(a[i].ch,id);if(r)return r}}return null}
function fP(a,id,p){for(var i=0;i<a.length;i++){if(a[i].id===id)return{p:p||a,i:i};if(a[i].ch){var r=fP(a[i].ch,id,a[i].ch);if(r)return r}}return null}
function cnt(n){if(n.t==='b')return 1;var c=0;(n.ch||[]).forEach(function(x){c+=cnt(x)});return c}
function fl(u){try{return new URL(u).hostname.replace('www.','').charAt(0).toUpperCase()}catch(e){return'?'}}
function isD(pid,cid){var n=fN(T,pid);if(!n||!n.ch)return false;for(var i=0;i<n.ch.length;i++){if(n.ch[i].id===cid)return true;if(n.ch[i].ch&&isD(n.ch[i].id,cid))return true}return false}

function rT(){$('tR').innerHTML=rN(T);var af=q('[data-af]');if(af){af.focus();af.select()}}
function rN(a){var h='';a.forEach(function(n){
  h+='<div class="drop-bar" data-db="'+n.id+'"></div>';
  if(n.t==='f'){
    h+='<div data-tid="'+n.id+'">';
    h+='<div class="trow" data-rid="'+n.id+'"><span class="arr'+(n.o?' open':'')+'" onclick="event.stopPropagation();xTg(\''+n.id+'\')">'+ARR+'</span><span class="fi">'+FOL+'</span>';
    if(eId===n.id)h+='<input class="ti-edit" value="'+esc(n.n)+'" data-af onblur="xSE(\''+n.id+'\',this.value)" onkeydown="event.stopPropagation();if(event.key===\'Enter\')xSE(\''+n.id+'\',this.value);if(event.key===\'Escape\'){eId=null;rT()}" onclick="event.stopPropagation()">';
    else h+='<span class="nm">'+esc(n.n)+'</span>';
    h+='<span class="cnt">'+cnt(n)+'</span><span class="acts"><button class="act" onclick="event.stopPropagation();eId=\''+n.id+'\';rT()">'+PEN+'</button><button class="act" onclick="event.stopPropagation();xDl(\''+n.id+'\')">'+XX+'</button></span></div>';
    h+='<div class="tch" data-chid="'+n.id+'" style="'+(n.o?'':'height:0;overflow:hidden')+'">'+rN(n.ch||[])+'</div></div>';

function nSl(id){
  // Save current note first
  if(curN&&editorInstance){
    editorInstance.save().then(function(data){
      var n=N.find(function(x){return x.id===curN});
      if(n)n.data=data;
      loadNote(id);
    }).catch(function(){loadNote(id)});
  } else {

  }

function loadNote(id){
  curN=id;rNL();
  var n=N.find(function(x){return x.id===id});
  if(!n){$('nE').innerHTML='<div class="ne-empty">Выберите заметку</div>';return}
  $('nE').innerHTML='<div id="ej_'+id+'"></div>';
  if(editorInstance){try{editorInstance.destroy()}catch(e){}}

  if(typeof EditorJS==='undefined'){
    $('nE').innerHTML='<div class="ne-empty" style="color:#e57373">Editor.js не загрузился.<br>Проверь что страница на GitHub Pages (не preview).</div>';
    return;
  }

  var tools={};
  if(typeof Header!=='undefined')tools.header={class:Header,inlineToolbar:true,config:{levels:[1,2,3,4],defaultLevel:2}};
  if(typeof NestedList!=='undefined')tools.list={class:NestedList,inlineToolbar:true};
  if(typeof Checklist!=='undefined')tools.checklist={class:Checklist,inlineToolbar:true};
  if(typeof Quote!=='undefined')tools.quote={class:Quote,inlineToolbar:true};
  if(typeof CodeTool!=='undefined')tools.code={class:CodeTool};
  if(typeof Delimiter!=='undefined')tools.delimiter={class:Delimiter};
  if(typeof Table!=='undefined')tools.table={class:Table,inlineToolbar:true,config:{rows:2,cols:3,withHeadings:true}};
  if(typeof Warning!=='undefined')tools.warning={class:Warning};
  if(typeof Marker!=='undefined')tools.marker={class:Marker};
  if(typeof InlineCode!=='undefined')tools.inlineCode={class:InlineCode};
  if(typeof Underline!=='undefined')tools.underline={class:Underline};

  editorInstance=new EditorJS({
    holder:'ej_'+id,
    placeholder:'Начните писать или нажмите Tab...',
    tools:tools,
    data:n.data||{blocks:[]},
    onChange:function(){
      editorInstance.save().then(function(data){
        var note=N.find(function(x){return x.id===curN});
        if(note){
          note.data=data;
          var firstText=(data.blocks[0]&&(data.blocks[0].data.text||'')).replace(/<[^>]*>/g,'');
          note.title=firstText.substring(0,50)||'Без названия';
          note.ts=++_ts;
          rNL();
        }
      });
    }
  });
}
